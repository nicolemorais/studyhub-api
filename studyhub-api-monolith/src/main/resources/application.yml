server:
  port: 8080

spring:
  application:
    name: studyhub-monolith

  # Conexão com o banco usando as variáveis de ambiente do .env
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/studyhub_db}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # Configurações do Hibernate/JPA
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Configuração da ferramenta de Migração (Flyway)
  flyway:
    enabled: true
    baseline-on-migrate: true

  # Configuração do Broker de Eventos
  kafka:
    bootstrap-servers: ${KAFKA_URL:localhost:9092}
    consumer:
      group-id: monolith-gamification-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

# Configuração do domínio de segurança
api:
  security:
    token:
      secret: ${JWT_SECRET}
