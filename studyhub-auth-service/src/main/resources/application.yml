server:
  port: 8081

spring:
  application:
    name: studyhub-auth-service
  
  # Conexão com o banco usando as variáveis de ambiente do .env
  datasource:
    url: ${AUTH_DB_URL}
    username: ${AUTH_DB_USER}
    password: ${AUTH_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # Configurações do Hibernate/JPA
  jpa:
    hibernate:
      ddl-auto: validate 
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Configuração da ferramenta de Migração (Flyway)
  flyway:
    enabled: true
    baseline-on-migrate: true

# Configuração do domínio de segurança
api:
  security:
    token:
      secret: ${JWT_SECRET}