spring.application.name=studyhub-api

server.port=8080
server.servlet.context-path=/api/v1

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/studyhub}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

studyhub.security.professor.user=${STUDYHUB_PROF_USER}
studyhub.security.professor.password=${STUDYHUB_PROF_PASS}

studyhub.security.estudante.user=${STUDYHUB_STUDENT_USER}
studyhub.security.estudante.password=${STUDYHUB_STUDENT_PASS}